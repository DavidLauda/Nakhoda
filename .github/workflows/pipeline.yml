name: Satellite pilot pipeline
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      source:
        description: Source to run
        type: choice
        options: [all, noaa, marine, sentinel]
        default: all
permissions:
  contents: read
concurrency:
  group: pesisir-pipeline
  cancel-in-progress: false
jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - name: Install bounded analysis dependencies
        run: pip install -r pipeline/requirements.txt
      - name: Run source-isolated discovery and publication
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CDSE_CLIENT_ID: ${{ secrets.CDSE_CLIENT_ID }}
          CDSE_CLIENT_SECRET: ${{ secrets.CDSE_CLIENT_SECRET }}
          COPERNICUSMARINE_SERVICE_USERNAME: ${{ secrets.COPERNICUSMARINE_SERVICE_USERNAME }}
          COPERNICUSMARINE_SERVICE_PASSWORD: ${{ secrets.COPERNICUSMARINE_SERVICE_PASSWORD }}
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python -m pipeline.run --source '${{ inputs.source || 'all' }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: discovery-metadata
          path: pipeline/out/*-discovery.json
          retention-days: 3
          if-no-files-found: ignore
